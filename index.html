<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Akan Name Generator</title>
    
</head>
<body><link rel="stylesheet" href="style.css">

    <div class="container">
        <h1>Akan name generator</h1>
        <p>
            kindly enter your birth date,month and year to get the akan name.
            The akan name generator will help you know the day of the week you were born born.
        </p>
        

        <form id="akanform">
            <label for="day">Day</label>
            <input type="number" id="day"  placeholder="DD" required>


            <label for="month">Month</label>
            <input type="number" id="month" placeholder="MM" required>


            <label for="year">Year</label>
            <input type="number" id="year" placeholder="YYYY" required>


            <label>Gender</label>
            <div class="gender">
                <input type="radio" name="gender" value="male"> male
                <input type="radio" name="gender" value="female">female
            </div>

            <button type="button">akan name</button>

        </form>

        <div id="results"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
